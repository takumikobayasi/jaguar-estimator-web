  </div>
  <script src="config.js"></script>
  <script>
    const state={tab:'history',mode:'日別',data:null,pin:'',hall:'',machines:[],number:'',events:null,eventsKey:'',eventsLoading:false,sort:'number-asc'}; const modes={history:['日別','台別','グラフ','つぶ履歴','情報'],capture:[],targets:['ランキング','島レイアウト','REG甘さ','見取図'],lab:['サマリー','機種別','曜日別','月別']};
    function applyTheme(theme){document.documentElement.dataset.theme=theme;const b=document.querySelector('#themeToggle');if(b){b.textContent=theme==='light'?'🌙':'☀';b.title=theme==='light'?'ダーク表示にする':'ホワイト表示にする'}}

    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const SPECS={
      aim:{big:[273.1,269.7,269.7,259,259,255],reg:[439.8,399.6,331,315.1,255,255],pay:[97,98,99.5,101.1,103.3,105.5]},

      funky:{big:[266.4,259,256,249.2,240.1,219.9],reg:[439.8,407.1,366.1,322.8,299.3,262.1],pay:[97,98.5,99.8,102,104.3,109]},
      happy:{big:[273.1,270.8,263.2,254,239.2,226],reg:[397.2,362.1,332.7,300.6,273.1,256],pay:[97,98.1,99.9,102.9,105.8,108.4]},
      girls:{big:[273.1,270.8,260.1,250.1,243.6,226],reg:[381,350.5,316.6,281.3,270.8,252.1],pay:[97,97.9,99.9,102.1,104,107.5]},

    };
    function isJugglerMachine(n){n=String(n||'');return /ｼﾞｬｸﾞ|ジャグ|JUGGLER/i.test(n)||/ﾈｵｱｲﾑ|ネオアイム|ｱｲﾑEX|アイムEX/.test(n)}
    function specFor(n){n=String(n||'');if(!isJugglerMachine(n))return null;if(/ﾏｲｼﾞｬｸﾞ|マイジャグ/.test(n))return SPECS.my;if(/ｺﾞｰｺﾞｰｼﾞｬｸﾞ|ゴーゴージャグ/.test(n))return SPECS.gogo;if(/ﾌｧﾝｷｰｼﾞｬｸﾞ|ファンキージャグ/.test(n))return SPECS.funky;if(/ﾊｯﾋﾟｰｼﾞｬｸﾞ|ハッピージャグ/.test(n))return SPECS.happy;if(/ｼﾞｬｸﾞﾗｰｶﾞｰﾙｽﾞ|ジャグラーガールズ/.test(n))return SPECS.girls;if(/ｳﾙﾄﾗﾐﾗｸﾙｼﾞｬｸﾞ|ウルトラミラクルジャグ|ｳﾙﾐﾗ|ウルミラ/.test(n))return SPECS.ultra;if(/ﾐｽﾀｰｼﾞｬｸﾞ|ミスタージャグ/.test(n))return SPECS.mister;if(/ﾈｵｱｲﾑ|ネオアイム|ｱｲﾑEX|アイムEX|ｱｲﾑｼﾞｬｸﾞ|アイムジャグ/.test(n))return SPECS.aim;return null}
    function estimateRows(rows){const spec=specFor(rows[0]?.machine);if(!spec)return null;const games=rows.reduce((a,x)=>a+Number(x.games||0),0),big=rows.reduce((a,x)=>a+Number(x.big||0),0),reg=rows.reduce((a,x)=>a+Number(x.reg||0),0);if(games<=1000)return null;const logs=spec.big.map((bd,i)=>big*Math.log(1/bd)+(games-big)*Math.log(1-1/bd)+reg*Math.log(1/spec.reg[i])+(games-reg)*Math.log(1-1/spec.reg[i]));const mx=Math.max(...logs),raw=logs.map(x=>Math.exp(x-mx)),z=raw.reduce((a,x)=>a+x,0),probs=raw.map(x=>x/z),likely=probs.indexOf(Math.max(...probs))+1,payout=probs.reduce((a,p,i)=>a+p*spec.pay[i],0),high=probs.slice(4).reduce((a,x)=>a+x,0);return {games,big,reg,probs,likely,payout,high}}
    function settingCard(rows){const e=estimateRows(rows),games=rows.reduce((a,x)=>a+Number(x.games||0),0);if(!e)return `<div class="empty">${games<=1000?'1000G以下のため設定推測を行いません':'この機種の設定データは未登録です'}</div>`;return `<div class="card"><div class="row"><div><div class="title">設定推測</div><div class="meta">${e.games.toLocaleString()}Gをアプリと同じベイズ式で計算</div></div><span class="badge">本命 設定${e.likely}</span></div><div class="setting-grid">${e.probs.map((p,i)=>`<div class="setting-row"><b>${i+1}</b><div class="setting-track"><i style="width:${(p*100).toFixed(1)}%"></i></div><span>${(p*100).toFixed(1)}%</span></div>`).join('')}</div><div class="meta" style="margin-top:12px">高設定(5・6) ${(e.high*100).toFixed(1)}%　期待機械割 ${e.payout.toFixed(2)}%</div></div>`}

    async function apiRequest(payload){const api=window.JUGGLER_API_URL||'';if(!api)return null;const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,pin:state.pin}),signal:controller.signal});if(!r.ok)throw new Error('API接続エラー');const text=await r.text();if(!text.trim())throw new Error('データ応答が空です');let result;try{result=JSON.parse(text)}catch(_){throw new Error('データが途中で切れました')}if(!result.ok)throw new Error(result.error||'読込エラー');return result.data}catch(err){if(err.name==='AbortError')throw new Error('読み込みが30秒を超えました');throw err}finally{clearTimeout(timer)}}
    async function loadData(){const live=await apiRequest({action:'summary'});if(live)return live;const r=await fetch('./sample-data.json',{cache:'no-store'});if(!r.ok)throw new Error();return r.json()}

    async function loadEvents(){const date=document.querySelector('#date')?.value||'';return await apiRequest({action:'events',hall:state.hall,machine:activeMachine(),number:state.number,date})||{events:[]}}
    document.querySelector('#pinForm').addEventListener('submit',async e=>{e.preventDefault();state.pin=document.querySelector('#pin').value.trim();if(!state.pin){document.querySelector('#error').textContent='PINを入力してください';return}const btn=e.currentTarget.querySelector('button');btn.disabled=true;btn.textContent='読み込み中…';document.querySelector('#error').textContent='ジャグラーデータを準備しています';try{state.data=await loadData();try{localStorage.setItem('juggler-view-pin',state.pin)}catch(_){}openViewer()}catch(err){document.querySelector('#error').textContent=err.message||'データを読み込めませんでした'}finally{btn.disabled=false;btn.textContent='確認する'}});
    const dragReady=new WeakSet();
    function enableHorizontalDrag(){document.querySelectorAll('.filter-buttons,.subtabs,.number-picker').forEach(el=>{if(dragReady.has(el))return;dragReady.add(el);let active=false,startX=0,startScroll=0,moved=false;el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;active=true;moved=false;startX=e.clientX;startScroll=el.scrollLeft;el.setPointerCapture?.(e.pointerId);el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(!active)return;const dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;if(moved){el.scrollLeft=startScroll-dx;e.preventDefault()}});const end=e=>{if(!active)return;active=false;el.releasePointerCapture?.(e.pointerId);el.classList.remove('dragging')};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false}},true);el.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})})}
    let savedPin='';try{savedPin=localStorage.getItem('juggler-view-pin')||''}catch(_){}

    function renderHalls(){const halls=[...new Set(state.data.history.map(x=>x.hall).filter(Boolean))].sort(),sheet=document.querySelector('#hallSheet'),backdrop=document.querySelector('#hallBackdrop'),toggle=document.querySelector('#hallToggle');sheet.innerHTML=`<div class="sheet-head"><strong>🏬 店舗を選択</strong><button id="hallClose" class="sheet-close" type="button">閉じる</button></div>`+halls.map(x=>`<button class="hall-choice ${state.hall===x?'active':''}" data-hall="${esc(x)}">${esc(x)}</button>`).join('');toggle.textContent=state.hall?`🏬 ${state.hall.replace(/D[’'\s-]*ステーション/g,'Dステ')}`:'🏬 店舗';toggle.title=state.hall||'店舗を選択';toggle.classList.toggle('selected',!!state.hall);const close=()=>{sheet.classList.add('hidden');backdrop.classList.add('hidden')};toggle.onclick=()=>{sheet.classList.remove('hidden');backdrop.classList.remove('hidden')};backdrop.onclick=close;sheet.querySelector('#hallClose').onclick=close;sheet.querySelectorAll('[data-hall]').forEach(btn=>btn.onclick=()=>{state.hall=btn.dataset.hall;state.machines=loadSavedMachines(state.hall);state.number='';state.events=null;state.eventsKey='';try{localStorage.setItem('juggler-view-hall',state.hall)}catch(_){}close();renderHalls();renderMachines();renderWeekDates();render()})}
    function renderMachines(){const hallRows=state.data.history.filter(x=>state.hall&&x.hall===state.hall),allMachines=[...new Set(hallRows.map(x=>x.machine).filter(Boolean))].sort();let d=hallRows;if(state.tab==='history'&&['グラフ','つぶ履歴'].includes(state.mode))d=d.filter(x=>specFor(x.machine));const machines=[...new Set(d.map(x=>x.machine).filter(Boolean))].sort();state.machines=state.machines.filter(x=>allMachines.includes(x));const panel=document.querySelector('#machineChecks'),status=document.querySelector('#categoryStatus');panel.innerHTML=machines.map(x=>`<label class="machine-check"><input type="checkbox" value="${esc(x)}" ${state.machines.includes(x)?'checked':''}><span>${esc(shortMachineName(x))}</span></label>`).join('');status.textContent=state.machines.length?`🎰 ${state.machines.length}機種選択中`:'🎰 機種選択';panel.querySelectorAll('input').forEach(box=>box.onchange=()=>{state.machines=box.checked?[...new Set([...state.machines,box.value])]:state.machines.filter(x=>x!==box.value);saveMachines();state.number='';state.events=null;state.eventsKey='';status.textContent=state.machines.length?`🎰 ${state.machines.length}機種選択中`:'🎰 機種選択';render()})}
    function renderWeekDates(){const select=document.querySelector('#date'),dates=[...new Set(state.data.history.filter(x=>!state.hall||x.hall===state.hall).map(x=>x.date))].sort().reverse().slice(0,7);if(!dates.includes(select.value))select.value=dates[0]||'';document.querySelector('#weekDates').innerHTML=dates.map(x=>{const d=new Date(normDate(x)+'T00:00:00'),day=d.getDay(),label=['日','月','火','水','木','金','土'][day];return `<button class="week-date ${select.value===x?'active':''} ${day===0?'sunday':day===6?'saturday':''}" data-date="${esc(x)}"><span>${label}</span><b>${d.getMonth()+1}/${d.getDate()}</b></button>`}).join('');document.querySelectorAll('[data-date]').forEach(btn=>btn.onclick=()=>{select.value=btn.dataset.date;state.events=null;state.eventsKey='';renderWeekDates();render()})}

        document.querySelectorAll('nav button[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.mode=modes[state.tab][0];document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderMachines();render()});

    function filtered(){let date=document.querySelector('#date')?.value,d=state.data.history;if(state.hall)d=d.filter(x=>x.hall===state.hall);if(date&&date!=='日付')d=d.filter(x=>x.date===date);if(!state.machines.length)return [];d=d.filter(x=>state.machines.includes(x.machine));return d}

    function targetView(){if(!state.hall)return '<div class="empty">上の「🏬 店舗」から店舗を選択してください</div>';const top=targetCandidates(),all=state.data.history.filter(x=>state.hall&&x.hall===state.hall&&state.machines.includes(x.machine));if(state.mode==='ランキング')return targetRanking(top);

esc(selectedDate)}<br>同一機種の連番（最大10台）を1ゴンドラとして自動判定</div><div class="gondola-list">${gondolas.map((g,gi)=>{const nums=g.rows.map(x=>Number(x.number)),range=nums.length>1?Math.min(...nums)+'〜'+Math.max(...nums):String(nums[0]);return `<section class="gondola-card"><div class="gondola-head"><div class="gondola-rank">${gi+1}位</div><div class="gondola-meta"><strong>${esc(g.machine)}</strong><span>${range}番台・${g.rows.length}台</span></div><div class="gondola-score"><strong>${g.score}</strong><span>ゴンドラ狙い度</span></div></div><div class="gondola-result">${g.resultCount?`結果 ${g.resultCount}/${g.rows.length}台取得${g.avgSetting!=null?'・平均推定 '+g.avgSetting.toFixed(2):'・推定データ不足'}`:'結果待ち'}</div><div class="machine-cells">${g.rows.map(x=>{const key=g.machine+'|'+x.number,rank=rankMap.get(key),result=resultMap.get(key),est=result?estimateRows([result]):null;return `<div class="machine-cell ${rank&&rank<=5?'predicted':''}">${rank?`<span class="prediction-rank">台 ${rank}位</span>`:''}<b>${esc(String(x.number).replace(/^0+/,''))}</b><i>${rank?'狙い度 '+predictionMap.get(key).score:'候補外'}</i><span class="result-label ${est?'good':'wait'}">${result?(est?'結果 設定'+est.likely:'結果 不足'):'結果待ち'}</span></div>`}).join('')}</div></section>`}).join('')}</div>`}
      if(state.mode==='REG甘さ'){const map={};all.forEach(x=>{const k=x.machine+'|'+x.number;(map[k]??={machine:x.machine,number:x.number,g:0,r:0}).g+=x.games;map[k].r+=x.reg});const rows=Object.values(map).filter(x=>x.g>=1000).sort((a,b)=>(a.g/Math.max(1,a.r))-(b.g/Math.max(1,b.r)));return `<div class="notice">保存期間を合算したREG確率ヒートマップ</div><div class="machine-cells">${rows.map(x=>{const rate=x.r?Math.round(x.g/x.r):9999,cl=rate<=280?'heat-good':rate<=340?'heat-mid':'heat-bad';return `<div class="machine-cell ${cl}"><b>${esc(x.number)}番</b><i>${esc(x.machine)}</i><i>1/${rate===9999?'-':rate}</i></div>`}).join('')}</div>`}
      return '<div class="empty">店内見取図の配置データは現在のバックアップに含まれていません。アプリの配置書き出し対応後にここへ表示します。</div>'}
    function groupedStats(keyFn){let rows=state.data.history.filter(x=>state.hall&&x.hall===state.hall&&state.machines.includes(x.machine)),g={};rows.forEach(x=>{const k=keyFn(x);const a=g[k]??={label:k,games:0,big:0,reg:0,count:0};a.games+=x.games;a.big+=x.big;a.reg+=x.reg;a.count++});return Object.values(g)}
    function statsTable(rows){if(!rows.length)return '<div class="empty">集計データがありません</div>';return `<div class="card"><table class="table"><thead><tr><th>区分</th><th>件数</th><th>平均G</th><th>BIG</th><th>REG</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.count}</td><td>${Math.round(x.games/x.count)}</td><td>${x.big?'1/'+Math.round(x.games/x.big):'-'}</td><td>${x.reg?'1/'+Math.round(x.games/x.reg):'-'}</td></tr>`).join('')}</tbody></table></div>`}
    function labView(){if(!state.hall)return '<div class="empty">上の「🏬 店舗」から店舗を選択してください</div>';const all=state.data.history.filter(x=>state.hall&&x.hall===state.hall&&state.machines.includes(x.machine));if(state.mode==='サマリー'){const est=estimateRows(all),dates=new Set(all.map(x=>x.date)),machines=new Set(all.map(x=>x.machine+'|'+x.number));return `<div class="summary"><div class="metric"><span>対象台</span><strong>${machines.size}</strong></div><div class="metric"><span>保存日数</span><strong>${dates.size}</strong></div><div class="metric"><span>推定設定</span><strong>${est?est.likely:'-'}</strong></div></div>${metrics(all)}${state.machines.length===1?settingCard(all):'<div class="notice">機種を1つ選ぶと、保存期間を合算した設定推測を表示します</div>'}`}
      if(state.mode==='機種別')return statsTable(groupedStats(x=>x.machine).sort((a,b)=>b.games-a.games));
      if(state.mode==='曜日別'){const names=['日','月','火','水','木','金','土'];return statsTable(groupedStats(x=>names[new Date(normDate(x.date)+'T00:00:00').getDay()]+'曜日').sort((a,b)=>names.indexOf(a.label[0])-names.indexOf(b.label[0])))}
      return statsTable(groupedStats(x=>normDate(x.date).slice(0,7)).sort((a,b)=>b.label.localeCompare(a.label)))}
    function render(){subtabs();document.querySelector('#content').innerHTML=state.tab==='history'?historyView():state.tab==='targets'?targetView():state.tab==='capture'?captureView():labView();if(state.tab==='history')wireHistory();enableHorizontalDrag()}
    document.querySelector('#date').onchange=()=>{state.events=null;state.eventsKey='';renderMachines();render()};document.querySelector('#reload').onclick=async()=>{const b=document.querySelector('#reload');b.disabled=true;b.textContent='…';try{state.data=await loadData();openViewer()}catch(err){alert(err.message||'更新できませんでした')}finally{b.disabled=false;b.textContent='↻'}};
</script>
