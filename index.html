<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <meta name="description" content="ジャグラーデータの履歴・狙い台・ラボを確認する閲覧専用サイト">
  <link rel="manifest" href="manifest.webmanifest">
  <title>JUGGLER VIEW</title>
  <style>
    :root{color-scheme:dark;--bg:#07101d;--panel:#0e1a2a;--line:#213148;--text:#f7fafc;--muted:#91a1b7;--green:#52e0a0;--yellow:#f4cf66;--red:#ff7185}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 85% -10%,#183258 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,"Noto Sans JP",system-ui,sans-serif}
    button,input{font:inherit}.hidden{display:none!important}.app{width:min(100%,760px);min-height:100dvh;margin:auto;padding:20px 16px 96px}
    .login{display:grid;place-items:center;min-height:100dvh;padding:24px}.login-card{width:min(100%,390px);padding:30px 24px;background:rgba(14,26,42,.9);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 80px #0008}
    .mark{display:grid;place-items:center;width:54px;height:54px;border-radius:17px;background:linear-gradient(145deg,var(--green),#1aa972);color:#03120c;font-weight:900;font-size:22px}.eyebrow{margin:20px 0 4px;color:var(--green);font-size:12px;font-weight:800;letter-spacing:.18em}.login h1{margin:0 0 8px;font-size:30px}.sub{margin:0;color:var(--muted);line-height:1.65}
    .pin{width:100%;margin-top:24px;padding:16px;border:1px solid var(--line);border-radius:14px;background:#081320;color:var(--text);font-size:22px;text-align:center;letter-spacing:.35em;outline:0}.pin:focus{border-color:var(--green)}
    .primary{width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--green);color:#04150e;font-weight:900}.error{min-height:22px;margin:10px 0 0;color:var(--red);font-size:13px;text-align:center}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:6px 0 24px}header h1{margin:0;font-size:25px;letter-spacing:.02em}.updated{margin-top:7px;color:var(--muted);font-size:12px}.headmeta{display:flex;align-items:center;gap:7px}.version{padding:6px 8px;border:1px solid var(--line);border-radius:8px;color:var(--green);font-size:10px;font-weight:900;white-space:nowrap}.live{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #255f49;border-radius:999px;background:#0b2a20;color:var(--green);font-size:11px;font-weight:800}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}.metric{padding:15px 12px;background:linear-gradient(145deg,#122034,#0c1726);border:1px solid var(--line);border-radius:17px}.metric span{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;margin-top:7px;font-size:20px}
    .section-title{margin:25px 2px 12px;font-size:13px;color:var(--muted);font-weight:800}.list{display:grid;gap:10px}.card{padding:17px;background:rgba(14,26,42,.92);border:1px solid var(--line);border-radius:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:800}.meta{margin-top:6px;color:var(--muted);font-size:12px}.badge{flex:none;padding:6px 9px;border-radius:9px;background:#1b2b40;color:#c9d5e5;font-size:11px;font-weight:800}.rank{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#23354d;color:var(--yellow);font-weight:900}.prob{color:var(--green);font-weight:900}.empty{padding:34px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
    nav{position:fixed;z-index:5;left:50%;bottom:0;transform:translateX(-50%);display:grid;grid-template-columns:repeat(3,1fr);width:min(100%,760px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(7,16,29,.93);border-top:1px solid var(--line);backdrop-filter:blur(18px)}nav button{padding:11px 4px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:800}nav button.active{background:#15253a;color:var(--green)}
    @media(min-width:680px){.app{padding-top:34px}.summary{gap:14px}.metric{padding:20px}.card{padding:20px}}
  .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:10px}.toolbar select,.reload{padding:10px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text)}.subtabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px;scrollbar-width:none}.subtab{flex:none;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:12px}.subtab.active{border-color:#47b889;background:#123528;color:var(--green)}.notice{padding:10px 12px;margin-bottom:11px;border-radius:11px;background:#172b3b;color:#baddf8;font-size:11px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{padding:10px 5px;text-align:right;border-bottom:1px solid var(--line)}.table th:first-child,.table td:first-child{text-align:left}.table th{color:var(--muted)}.progress{height:6px;margin-top:10px;border-radius:5px;background:#283242;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#55b7ff,var(--green))}.bars{display:grid;gap:10px;margin-top:12px}.barrow{display:grid;grid-template-columns:74px 1fr 42px;gap:8px;align-items:center;font-size:11px}.bar{height:8px;border-radius:5px;background:#293345;overflow:hidden}.bar i{display:block;height:100%;background:#55b7ff}</style>
</head>
<body>
  <main id="login" class="login">
    <section class="login-card">
      <div class="mark">G!</div><p class="eyebrow">PRIVATE VIEWER</p><h1>JUGGLER VIEW</h1>
      <p class="sub">履歴・狙い台・ラボを、どの端末からでも。</p>
      <form id="pinForm"><input id="pin" class="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="PIN" aria-label="共通PIN"><button class="primary">確認する</button><p id="error" class="error"></p></form>
    </section>
  </main>
  <div id="viewer" class="app hidden">
    <header><div><p class="eyebrow" style="margin-top:0">JUGGLER VIEW</p><h1 id="pageTitle">履歴</h1><div id="updated" class="updated"></div></div><div class="headmeta"><span class="version">WEB v0.3.4</span><span class="live">閲覧専用</span></div></header>
    <div id="hallButtons" class="subtabs"></div><div class="toolbar"><select id="date"><option>日付</option></select><button id="reload" class="reload">↻</button></div><div id="subtabs" class="subtabs"></div><section id="content"></section>
    <nav aria-label="メインメニュー"><button data-tab="history" class="active">履歴</button><button data-tab="targets">狙い台</button><button data-tab="lab">ラボ</button></nav>
  </div>
  <script src="config.js"></script>
  <script>
    const state={tab:'history',mode:'日別',data:null,pin:'',hall:''}; const modes={history:['日別','📷','台別','情報'],targets:['ランキング','島レイアウト','REG甘さ'],lab:['サマリー','機種別','曜日別']};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function loadData(){const api=window.JUGGLER_API_URL||'';if(api){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:state.pin})});if(!r.ok)throw new Error('API接続エラー');const result=await r.json();if(!result.ok)throw new Error(result.error||'読込エラー');return result.data}const r=await fetch('./sample-data.json',{cache:'no-store'});if(!r.ok)throw new Error();return r.json()}
    document.querySelector('#pinForm').addEventListener('submit',async e=>{e.preventDefault();state.pin=document.querySelector('#pin').value.trim();if(!state.pin){document.querySelector('#error').textContent='PINを入力してください';return}try{state.data=await loadData();openViewer()}catch(err){document.querySelector('#error').textContent=err.message||'データを読み込めませんでした'}});
    function renderHalls(){let halls=[...new Set(state.data.history.map(x=>x.hall))];document.querySelector('#hallButtons').innerHTML=halls.map(x=>`<button class="subtab ${state.hall===x?'active':''}" data-hall="${esc(x)}">${esc(x.replace('Dステーション','Dステ'))}</button>`).join('');document.querySelectorAll('[data-hall]').forEach(btn=>btn.onclick=()=>{state.hall=btn.dataset.hall;renderHalls();render()})}
    function openViewer(){document.querySelector('#login').classList.add('hidden');document.querySelector('#viewer').classList.remove('hidden');document.querySelector('#updated').textContent=`最終更新 ${state.data.generatedAt}`;let halls=[...new Set(state.data.history.map(x=>x.hall))];state.hall=halls.find(x=>x.includes('Dステ'))||halls[0]||'';renderHalls();let dates=[...new Set(state.data.history.map(x=>x.date))].sort().reverse();document.querySelector('#date').innerHTML=dates.map(x=>`<option>${esc(x)}</option>`).join('');render()}
        document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.mode=modes[state.tab][0];document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
    function metrics(items){let games=items.reduce((a,x)=>a+x.games,0),big=items.reduce((a,x)=>a+x.big,0),reg=items.reduce((a,x)=>a+x.reg,0);return `<div class="summary"><div class="metric"><span>総回転</span><strong>${games.toLocaleString()}</strong></div><div class="metric"><span>BIG</span><strong>${big}</strong></div><div class="metric"><span>REG</span><strong>${reg}</strong></div></div>`}
    function filtered(){let date=document.querySelector('#date')?.value,d=state.data.history;if(state.hall)d=d.filter(x=>x.hall===state.hall);if(date&&date!=='日付')d=d.filter(x=>x.date===date);return d}
    function subtabs(){document.querySelector('#subtabs').innerHTML=modes[state.tab].map(x=>`<button class="subtab ${state.mode===x?'active':''}" data-mode="${x}">${x}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()})}
    function historyView(){let d=filtered();if(state.mode==='日別')return `<div class="notice">🟢 ${esc(document.querySelector('#date')?.value||'')} のスナップショット</div>${metrics(d)}<div class="card"><table class="table"><thead><tr><th>台</th><th>G</th><th>BIG</th><th>REG</th><th>合算</th></tr></thead><tbody>${d.map(x=>`<tr><td>${esc(x.number)}</td><td>${x.games}</td><td>${x.big}</td><td>${x.reg}</td><td>1/${Math.round(x.games/(x.big+x.reg))}</td></tr>`).join('')}</tbody></table></div>`;
      if(state.mode==='台別')return `<div class="list">${d.map(x=>`<article class="card"><div class="row"><div><div class="title">${esc(x.number)}番台　${esc(x.machine)}</div><div class="meta">${esc(x.hall)} ・ ${esc(x.date)}</div></div><span class="badge">設定推測</span></div><div class="progress"><i style="width:${Math.min(100,x.reg*4)}%"></i></div><div class="meta">${x.games.toLocaleString()}G　BIG ${x.big}　REG ${x.reg}　REG 1/${Math.round(x.games/x.reg)}</div></article>`).join('')}</div>`;
            if(state.mode==='情報')return `<div class="list"><div class="card"><div class="title">取得状況</div><div class="meta">最終更新：${esc(state.data.generatedAt)}</div></div><div class="card"><div class="title">Web共有</div><div class="meta">閲覧専用・schemaVersion ${state.data.schemaVersion}</div></div></div>`;
      return '<div class="empty">スクリーンショットは実データ連携後に表示します</div>'}
    function targetView(){let d=state.data.targets;if(state.mode==='ランキング')return `<div class="notice">全機種横断トップ候補</div><div class="list">${d.map((x,i)=>`<article class="card"><div class="row"><div class="rank">${i+1}</div><div style="flex:1"><div class="title">${esc(x.number)}番台　${esc(x.machine)}</div><div class="meta">${esc(x.hall)}</div></div><span class="prob">${x.score}点</span></div><div class="meta" style="margin-top:10px">${esc(x.reason)}</div></article>`).join('')}</div>`;
      if(state.mode==='島レイアウト')return `<div class="card"><div class="title">サンプル店A・ジャグラー島</div><div class="subtabs" style="margin-top:14px">${d.map((x,i)=>`<span class="subtab active">${i+1}位<br>${esc(x.number)}番</span>`).join('')}</div><div class="meta">実データ連携後に店舗の見取り図を反映します</div></div>`;
      return `<div class="card"><div class="title">REG甘さ</div><div class="bars">${d.map(x=>`<div class="barrow"><span>${esc(x.number)}番台</span><div class="bar"><i style="width:${x.score}%"></i></div><b>${x.score}</b></div>`).join('')}</div></div>`}
    function labView(){let l=state.data.lab;if(state.mode==='サマリー')return `<div class="summary"><div class="metric"><span>対象台</span><strong>${l.machines}</strong></div><div class="metric"><span>平均G</span><strong>${l.avgGames.toLocaleString()}</strong></div><div class="metric"><span>推定設定</span><strong>${l.setting}</strong></div></div><p class="section-title">研究結果</p><div class="list">${l.rows.map(x=>`<div class="card"><div class="row"><div><div class="title">${esc(x.label)}</div><div class="meta">${esc(x.note)}</div></div><span class="badge">${esc(x.value)}</span></div></div>`).join('')}</div>`;
      let labels=state.mode==='機種別'?['マイジャグV','ゴーゴー3','アイムEX']:['月','火','水','木','金','土','日'];return `<div class="card"><div class="title">${state.mode}の傾向</div><div class="bars">${labels.map((x,i)=>`<div class="barrow"><span>${x}</span><div class="bar"><i style="width:${45+i*6}%"></i></div><b>${(1.8+i*.12).toFixed(2)}</b></div>`).join('')}</div><div class="meta">実データ接続後にアプリと同じ集計値へ置換します</div></div>`}
    function render(){const titles={history:'履歴',targets:'狙い台',lab:'ラボ'};document.querySelector('#pageTitle').textContent=titles[state.tab];subtabs();document.querySelector('#content').innerHTML=state.tab==='history'?historyView():state.tab==='targets'?targetView():labView()}
    document.querySelector('#date').onchange=render;document.querySelector('#reload').onclick=async()=>{state.data=await loadData();openViewer()};
</script>
</body>
</html>
