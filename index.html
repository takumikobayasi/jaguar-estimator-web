  <main id="login" class="login">

  <script>
    const state={tab:'history',mode:'日別',data:null,pin:'',hall:'',machine:'all',number:'',events:null,eventsKey:'',eventsLoading:false,sort:'number-asc'}; const modes={history:['日別','台別','グラフ','つぶ履歴','取得状況','情報'],targets:['ランキング','島レイアウト','REG甘さ','見取図'],lab:['サマリー','機種別','曜日別','月別']};
    function applyTheme(theme){document.documentElement.dataset.theme=theme;const b=document.querySelector('#themeToggle');if(b){b.textContent=theme==='light'?'🌙':'☀';b.title=theme==='light'?'ダーク表示にする':'ホワイト表示にする'}}

    document.querySelector('#themeToggle').onclick=()=>{const next=document.documentElement.dataset.theme==='light'?'dark':'light';try{localStorage.setItem('juggler-view-theme',next)}catch(_){}applyTheme(next)};
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const SPECS={
      aim:{big:[273.1,269.7,269.7,259,259,255],reg:[439.8,399.6,331,315.1,255,255],pay:[97,98,99.5,101.1,103.3,105.5]},

      girls:{big:[273.1,270.8,260.1,250.1,243.6,226],reg:[381,350.5,316.6,281.3,270.8,252.1],pay:[97,97.9,99.9,102.1,104,107.5]},

    };
    function isJugglerMachine(n){n=String(n||'');return /ｼﾞｬｸﾞ|ジャグ|JUGGLER/i.test(n)||/ﾈｵｱｲﾑ|ネオアイム|ｱｲﾑEX|アイムEX/.test(n)}
    function specFor(n){n=String(n||'');if(!isJugglerMachine(n))return null;if(/ﾏｲｼﾞｬｸﾞ|マイジャグ/.test(n))return SPECS.my;if(/ｺﾞｰｺﾞｰｼﾞｬｸﾞ|ゴーゴージャグ/.test(n))return SPECS.gogo;if(/ﾌｧﾝｷｰｼﾞｬｸﾞ|ファンキージャグ/.test(n))return SPECS.funky;if(/ﾊｯﾋﾟｰｼﾞｬｸﾞ|ハッピージャグ/.test(n))return SPECS.happy;if(/ｼﾞｬｸﾞﾗｰｶﾞｰﾙｽﾞ|ジャグラーガールズ/.test(n))return SPECS.girls;if(/ｳﾙﾄﾗﾐﾗｸﾙｼﾞｬｸﾞ|ウルトラミラクルジャグ|ｳﾙﾐﾗ|ウルミラ/.test(n))return SPECS.ultra;if(/ﾐｽﾀｰｼﾞｬｸﾞ|ミスタージャグ/.test(n))return SPECS.mister;if(/ﾈｵｱｲﾑ|ネオアイム|ｱｲﾑEX|アイムEX|ｱｲﾑｼﾞｬｸﾞ|アイムジャグ/.test(n))return SPECS.aim;return null}
    function estimateRows(rows){const spec=specFor(rows[0]?.machine);if(!spec)return null;const games=rows.reduce((a,x)=>a+Number(x.games||0),0),big=rows.reduce((a,x)=>a+Number(x.big||0),0),reg=rows.reduce((a,x)=>a+Number(x.reg||0),0);const logs=spec.big.map((bd,i)=>big*Math.log(1/bd)+(games-big)*Math.log(1-1/bd)+reg*Math.log(1/spec.reg[i])+(games-reg)*Math.log(1-1/spec.reg[i]));const mx=Math.max(...logs),raw=logs.map(x=>Math.exp(x-mx)),z=raw.reduce((a,x)=>a+x,0),probs=raw.map(x=>x/z),likely=probs.indexOf(Math.max(...probs))+1,payout=probs.reduce((a,p,i)=>a+p*spec.pay[i],0),high=probs.slice(4).reduce((a,x)=>a+x,0);return {games,big,reg,probs,likely,payout,high}}

    const dragReady=new WeakSet();

    function renderHalls(){let halls=[...new Set(state.data.history.map(x=>x.hall))];document.querySelector('#hallButtons').innerHTML=halls.map(x=>`<button class="${state.hall===x?'active':''}" data-hall="${esc(x)}">${esc(x.replace('Dステーション','Dステ'))}</button>`).join('');document.querySelectorAll('[data-hall]').forEach(btn=>btn.onclick=()=>{state.hall=btn.dataset.hall;state.machine='all';state.number='';state.events=null;state.eventsKey='';renderHalls();renderMachines();render()})}

    function subtabs(){const icons={日別:'📅',台別:'🎰',グラフ:'📈',つぶ履歴:'🔴',取得状況:'🗓️',情報:'ℹ️',ランキング:'🏆',島レイアウト:'🗺️',REG甘さ:'🔵',見取図:'🏬',サマリー:'📊',機種別:'🎰',曜日別:'📆',月別:'🗓️'};document.querySelector('#subtabs').innerHTML=modes[state.tab].map(x=>`<button class="subtab ${state.mode===x?'active':''}" data-mode="${x}">${icons[x]||''} ${x}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;if(state.mode==='つぶ履歴'){state.number='';state.events=null;state.eventsKey=''}renderMachines();render()})}

    function lineChart(values,labels){if(!values.length)return '<div class="empty">グラフにできるデータがありません</div>';const w=620,h=210,p=28,min=Math.min(...values),max=Math.max(...values),span=Math.max(1,max-min),pts=values.map((v,i)=>{const x=p+(values.length===1?(w-2*p)/2:i*(w-2*p)/(values.length-1)),y=p+(max-v)*(h-2*p)/span;return {x,y,v}});return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="日別推移グラフ"><line class="chart-grid" x1="${p}" y1="${p}" x2="${p}" y2="${h-p}"/><line class="chart-grid" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><polyline class="chart-line" points="${pts.map(q=>q.x+','+q.y).join(' ')}"/>${pts.map(q=>`<circle class="chart-dot" cx="${q.x}" cy="${q.y}" r="4"/>`).join('')}<text class="chart-label" x="2" y="${p+3}">${Math.round(max)}</text><text class="chart-label" x="2" y="${h-p+3}">${Math.round(min)}</text></svg><div class="legend"><span>${esc(labels[0]||'')}</span><span>${values.length}日分</span><span>${esc(labels[labels.length-1]||'')}</span></div></div>`}
    function dailyGraphView(){if(state.machine==='all')return numberPicker();const nums=numberPicker();const rows=machineRecords().filter(x=>String(x.number)===String(state.number)).sort((a,b)=>a.date.localeCompare(b.date));const rates=rows.map(x=>x.reg?Math.round(x.games/x.reg):0);return `${nums}<div class="card"><div class="row"><div><div class="title">${esc(state.number)}番台　${esc(state.machine)}</div><div class="meta">日別REG確率の推移（数値が小さいほどREGが良好）</div></div><span class="badge">${rows.length}日</span></div>${lineChart(rates,rows.map(x=>x.date))}</div><p class="section-title">設定推測</p>${settingCard(rows)}<p class="section-title">日別データ</p><div class="card"><table class="table"><thead><tr><th>日付</th><th>G</th><th>BIG</th><th>REG</th><th>REG</th></tr></thead><tbody>${rows.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${x.games}</td><td>${x.big}</td><td>${x.reg}</td><td>${x.reg?'1/'+Math.round(x.games/x.reg):'-'}</td></tr>`).join('')}</tbody></table></div>`}
    function slumpChart(events){let game=0,diff=0,values=[0],labels=['0G'];events.forEach(e=>{game+=Number(e.gameGap||0);diff-=Number(e.gameGap||0)*3;diff+=/BIG|BB|ビッグ/i.test(e.type)?240:96;values.push(diff);labels.push(game+'G')});return lineChart(values,labels)}
    function grainView(){const picker=numberPicker();if(state.machine==='all'||!state.number)return picker;const date=document.querySelector('#date')?.value||'';const key=[state.hall,state.machine,state.number,date].join('|');if(state.eventsLoading)return picker+'<div class="loading">つぶ履歴を読み込み中…</div>';if(state.eventsKey!==key||!state.events)return picker+'<div class="loading">つぶ履歴を準備中…</div>';const events=state.events;if(!events.length)return picker+'<div class="empty">この台・日付のつぶ履歴は保存されていません</div>';return `${picker}<div class="notice">${esc(date)}　${esc(state.number)}番台　${events.length}回</div><div class="card"><div class="title">疑似スランプグラフ</div><div class="meta">BIG +240枚／REG +96枚／通常時 −3枚×Gで概算</div>${slumpChart(events)}</div><p class="section-title">つぶ履歴</p><div class="grain-list">${events.map((e,i)=>{const big=/BIG|BB|ビッグ/i.test(e.type);return `<div class="grain"><span class="grain-type ${big?'big':'reg'}">${big?'BIG':'REG'}</span><div><div class="grain-gap">${Number(e.gameGap||0).toLocaleString()}G</div><div class="grain-time">#${e.seq||i+1}　${esc(e.time||'時刻なし')}</div></div><span class="badge">${big?'+240':'+96'}</span></div>`}).join('')}</div>`}
    function normDate(s){return String(s||'').replace(/\//g,'-')}
    function captureView(){let rows=state.data.history.filter(x=>!state.hall||x.hall===state.hall);if(state.machine!=='all')rows=rows.filter(x=>x.machine===state.machine);const grouped={};rows.forEach(x=>(grouped[normDate(x.date)]??=[]).push(x));const dates=Object.keys(grouped).sort(),end=dates.length?new Date(dates[dates.length-1]+'T00:00:00'):new Date(),start=new Date(end);start.setDate(start.getDate()-41);const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=d.toISOString().slice(0,10),rs=grouped[key]||[];let status='none';if(rs.length){const latest=Math.max(...rs.map(x=>Number(x.capturedAt||0)));const cap=new Date(latest<1e12?latest*1000:latest),jst=new Date(cap.getTime()+9*3600000);status=(jst.toISOString().slice(0,10)>key||jst.getUTCHours()>=23)?'confirmed':'progressing'}cells.push(`<div class="day ${status}"><strong>${d.getDate()}</strong><span>${rs.length?rs.length+'台':'―'}</span></div>`)}return `<div class="notice">🟢確定　🟡途中　グレー未取得</div><div class="card"><div class="calendar-head">${['日','月','火','水','木','金','土'].map(x=>`<span>${x}</span>`).join('')}</div><div class="calendar">${cells.join('')}</div></div>`}

    function sortRows(rows){const d=[...rows],rate=(x,n)=>Number(x[n]||0)>0?Number(x.games||0)/Number(x[n]):Infinity,bonus=x=>Number(x.big||0)+Number(x.reg||0)>0?Number(x.games||0)/(Number(x.big||0)+Number(x.reg||0)):Infinity,est=x=>rowEstimate(x);switch(state.sort){case'number-desc':return d.sort((a,b)=>String(b.number).localeCompare(String(a.number),'ja',{numeric:true}));case'games-desc':return d.sort((a,b)=>b.games-a.games);case'big-rate':return d.sort((a,b)=>rate(a,'big')-rate(b,'big'));case'reg-rate':return d.sort((a,b)=>rate(a,'reg')-rate(b,'reg'));case'bonus-rate':return d.sort((a,b)=>bonus(a)-bonus(b));case'setting-desc':return d.sort((a,b)=>(est(b)?.likely||0)-(est(a)?.likely||0));case'high-desc':return d.sort((a,b)=>(est(b)?.high||0)-(est(a)?.high||0));case'payout-desc':return d.sort((a,b)=>(est(b)?.payout||0)-(est(a)?.payout||0));default:return d.sort((a,b)=>String(a.number).localeCompare(String(b.number),'ja',{numeric:true}))}}

    function targetView(){const top=targetCandidates(),all=state.data.history.filter(x=>(!state.hall||x.hall===state.hall)&&(state.machine==='all'||x.machine===state.machine));if(state.mode==='ランキング')return `<div class="notice">選択日の全機種横断トップ候補</div><div class="list">${top.slice(0,20).map((x,i)=>`<article class="card"><div class="row"><div class="rank">${i+1}</div><div style="flex:1"><div class="title">${esc(x.number)}番台　${esc(x.machine)}</div><div class="meta">${esc(x.hall)}</div></div><span class="prob">${x.score}点</span></div><div class="meta" style="margin-top:10px">${esc(x.reason)}</div></article>`).join('')}</div>`;
      if(state.mode==='島レイアウト'){const groups={};filtered().forEach(x=>(groups[x.machine]??=[]).push(x));const hot=new Set(top.slice(0,5).map(x=>x.machine+'|'+x.number));return `<div class="islands">${Object.entries(groups).map(([m,rs])=>`<div class="island"><div class="title">${esc(m)}</div><div class="machine-cells">${rs.sort((a,b)=>String(a.number).localeCompare(String(b.number),'ja',{numeric:true})).map(x=>`<div class="machine-cell ${hot.has(m+'|'+x.number)?'hot':''}">${esc(x.number)}<i>REG ${x.reg?'1/'+Math.round(x.games/x.reg):'-'}</i></div>`).join('')}</div></div>`).join('')}</div>`}
      if(state.mode==='REG甘さ'){const map={};all.forEach(x=>{const k=x.machine+'|'+x.number;(map[k]??={machine:x.machine,number:x.number,g:0,r:0}).g+=x.games;map[k].r+=x.reg});const rows=Object.values(map).filter(x=>x.g>=1000).sort((a,b)=>(a.g/Math.max(1,a.r))-(b.g/Math.max(1,b.r)));return `<div class="notice">保存期間を合算したREG確率ヒートマップ</div><div class="machine-cells">${rows.map(x=>{const rate=x.r?Math.round(x.g/x.r):9999,cl=rate<=280?'heat-good':rate<=340?'heat-mid':'heat-bad';return `<div class="machine-cell ${cl}"><b>${esc(x.number)}番</b><i>${esc(x.machine)}</i><i>1/${rate===9999?'-':rate}</i></div>`}).join('')}</div>`}
      return '<div class="empty">店内見取図の配置データは現在のバックアップに含まれていません。アプリの配置書き出し対応後にここへ表示します。</div>'}
    function groupedStats(keyFn){let rows=state.data.history.filter(x=>(!state.hall||x.hall===state.hall)&&(state.machine==='all'||x.machine===state.machine)),g={};rows.forEach(x=>{const k=keyFn(x);const a=g[k]??={label:k,games:0,big:0,reg:0,count:0};a.games+=x.games;a.big+=x.big;a.reg+=x.reg;a.count++});return Object.values(g)}
    function statsTable(rows){if(!rows.length)return '<div class="empty">集計データがありません</div>';return `<div class="card"><table class="table"><thead><tr><th>区分</th><th>件数</th><th>平均G</th><th>BIG</th><th>REG</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.count}</td><td>${Math.round(x.games/x.count)}</td><td>${x.big?'1/'+Math.round(x.games/x.big):'-'}</td><td>${x.reg?'1/'+Math.round(x.games/x.reg):'-'}</td></tr>`).join('')}</tbody></table></div>`}
    function labView(){const all=state.data.history.filter(x=>(!state.hall||x.hall===state.hall)&&(state.machine==='all'||x.machine===state.machine));if(state.mode==='サマリー'){const est=estimateRows(all),dates=new Set(all.map(x=>x.date)),machines=new Set(all.map(x=>x.machine+'|'+x.number));return `<div class="summary"><div class="metric"><span>対象台</span><strong>${machines.size}</strong></div><div class="metric"><span>保存日数</span><strong>${dates.size}</strong></div><div class="metric"><span>推定設定</span><strong>${est?est.likely:'-'}</strong></div></div>${metrics(all)}${state.machine!=='all'?settingCard(all):'<div class="notice">機種を選ぶと、保存期間を合算した設定推測を表示します</div>'}`}
      if(state.mode==='機種別')return statsTable(groupedStats(x=>x.machine).sort((a,b)=>b.games-a.games));
      if(state.mode==='曜日別'){const names=['日','月','火','水','木','金','土'];return statsTable(groupedStats(x=>names[new Date(normDate(x.date)+'T00:00:00').getDay()]+'曜日').sort((a,b)=>names.indexOf(a.label[0])-names.indexOf(b.label[0])))}
      return statsTable(groupedStats(x=>normDate(x.date).slice(0,7)).sort((a,b)=>b.label.localeCompare(a.label)))}
    function render(){const titles={history:'履歴',targets:'狙い台',lab:'ラボ'};document.querySelector('#pageTitle').textContent=titles[state.tab];subtabs();document.querySelector('#content').innerHTML=state.tab==='history'?historyView():state.tab==='targets'?targetView():labView();if(state.tab==='history')wireHistory();enableHorizontalDrag()}
    document.querySelector('#date').onchange=()=>{state.events=null;state.eventsKey='';renderMachines();render()};document.querySelector('#reload').onclick=async()=>{state.data=await loadData();openViewer()};
</script>
</body>
</html>
